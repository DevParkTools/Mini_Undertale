const fontCache={};
function setF(px){
let f=fontCache[px];
if(!f){
const fam=px%11===0?"'Galmuri11'":(px%9===0?"'Galmuri9'":(px%7===0?"'Galmuri7'":"'Galmuri11'"));
f=px+'px '+fam+",'Malgun Gothic','Apple SD Gothic Neo',monospace";
fontCache[px]=f;
}
ctx.font=f;
}
if(document.fonts&&document.fonts.load){
document.fonts.load('22px Galmuri11','가');
document.fonts.load('18px Galmuri9','가');
document.fonts.load('14px Galmuri7','가');
}
function wrapTxt(str,maxW,px){
setF(px);
const paras=str.split('\n');
const out=[];
for(let i=0;i<paras.length;i++){
const p=paras[i];
let line='';
for(let j=0;j<p.length;j++){
const ch=p[j];
if(line.length>0&&ctx.measureText(line+ch).width>maxW){
out.push(line);
line=ch===' '?'':ch;
}else line+=ch;
}
out.push(line);
}
return out.join('\n');
}

function mkGrid(gw,gh,fn){
const g=new Array(gw*gh);
for(let y=0;y<gh;y++){
for(let x=0;x<gw;x++)g[y*gw+x]=fn(x,y)||null;
}
return g;
}
function outlineGrid(g,gw,gh,col){
const o=g.slice();
for(let y=0;y<gh;y++){
for(let x=0;x<gw;x++){
const i=y*gw+x;
if(g[i])continue;
if((x>0&&g[i-1])||(x<gw-1&&g[i+1])||(y>0&&g[i-gw])||(y<gh-1&&g[i+gw]))o[i]=col;
}
}
return o;
}
function gridCanvas(g,gw,gh,s){
const c=document.createElement('canvas');
c.width=gw*s;
c.height=gh*s;
const k=c.getContext('2d');
for(let y=0;y<gh;y++){
for(let x=0;x<gw;x++){
const col=g[y*gw+x];
if(col){k.fillStyle=col;k.fillRect(x*s,y*s,s,s);}
}
}
return c;
}
function rowsGrid(rows,pal){
const gh=rows.length,gw=rows[0].length;
return mkGrid(gw,gh,(x,y)=>{
const ch=rows[y][x];
return ch==='.'?null:pal[ch];
});
}
function flipRows(rows){
return rows.map(r=>r.split('').reverse().join(''));
}
function inStar(dx,dy,n,rin,rout,rot){
const r=Math.sqrt(dx*dx+dy*dy);
const th=Math.atan2(dy,dx);
const f=(Math.cos(n*(th-rot))+1)/2;
return r<=rin+(rout-rin)*Math.pow(f,1.5);
}
function discSpr(rpx,ps,fill,edge,edgeW){
const n=Math.ceil(2*rpx/ps)+2;
const rc=rpx/ps;
const g=mkGrid(n,n,(x,y)=>{
const d=Math.hypot(x+0.5-n/2,y+0.5-n/2);
if(d>rc)return null;
return d>rc-edgeW?edge:fill;
});
return gridCanvas(g,n,n,ps);
}

function tone(f,d,type,v,to,when){
if(!AC)return;
const t0=when||AC.currentTime;
const o=AC.createOscillator();
const g=AC.createGain();
o.type=type;
o.frequency.setValueAtTime(f,t0);
if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
g.gain.setValueAtTime(v,t0);
g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
o.connect(g);
g.connect(master);
o.start(t0);
o.stop(t0+d+0.02);
}
function noise(d,v,fq,when){
if(!AC)return;
const t0=when||AC.currentTime;
const s=AC.createBufferSource();
s.buffer=noiseBuf;
const f=AC.createBiquadFilter();
f.type='bandpass';
f.frequency.value=fq;
const g=AC.createGain();
g.gain.setValueAtTime(v,t0);
g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
s.connect(f);
f.connect(g);
g.connect(master);
s.start(t0);
s.stop(t0+d+0.02);
}

function loadGame(i){

function enemyAlive(){

}

function killCount(){
let n=0;
for(let i=0;i<NS;i++){
if(results[i]===2)n++;
}
return n;
}
function shopMul(){
return killCount()>=1?2:1;
}
function gainGold(n){
gold+=n;
}
function calcEnding(){
if(killCount()===NS&&meta.e.kill+meta.e.void>0)return 'void';
if(results[NS-1]===2)return 'kill';
if(killCount()===0)return 'peace';
return 'neutral';
}
function finishBattle(kind){
results[stage]=kind==='spare'?1:2;
sfx(kind==='spare'?'win':'kill');
let arr;
if(stage===NS-1)arr=[];
else arr=kind==='spare'?cur.spare:cur.kill;
if(kind==='spare')items[0].n++;
stage++;
if(stage>=NS){
ending=calcEnding();
meta.e[ending]++;
saveMeta();
saveGame();
if(ending==='peace')sfx('bell');
storyText(arr.concat(endingInfo[ending].lines),()=>{state='end';});

storyText(arr,resumeWorld);

}

}

say(cur.lines[turn%cur.lines.length]+(blue?'\n* 영혼이 파랗게 물들었다! (↑ 점프)':''),beginDodge);
}
function beginDodge(){
state='dodge';

soulVy=0;

bub.text=wrapTxt(sp2[turn%sp2.length],150,18);
bub.lines=bub.text.split('\n').length;
dodgeT=-1.4;
spawnT=0.4;
ringA=0;

function startAttack(){

atk.x=60;
}
function resolveAttack(){
const d=Math.abs(atk.x-320);
const dmg=Math.max(1,Math.round((14+lv*6)*(1-d/260))-cur.def);
enemyHp-=dmg;
dmgN=dmg;
dmgT=0.9;
shake=0.4;
hpShow=2.5;
sfx('slash');
sfx('enemyhit');
if(enemyHp<=0){
const up=gainExp(EXPGAIN[stage]);
gainGold(GOLD[stage]);
say('* '+cur.name+'은(는) 바람에 흩어졌다...',()=>{
say('* 당신은 승리했다!\n* '+EXPGAIN[stage]+' EXP와 '+GOLD[stage]+' G를 얻었다.'+(up?'\n* LV가 올랐다!':''),()=>finishBattle('kill'));
if(up)sfx('sparkle');
});
}else if(cur.pat2&&!phase2&&enemyHp*2<=enemyMax){
phase2=true;
sfx('enemyhit');
say('* '+cur.name+'에게 '+dmg+' 피해를 입혔다!',()=>say('* 종소리가 갈라진다!\n* 그림자의 기운이 거세졌다!',enemyTurn));
}else say('* '+cur.name+'에게 '+dmg+' 피해를 입혔다!',enemyTurn);
}

return;
}
const was=mercy;
mercy=Math.max(0,Math.min(100,mercy+a.add));
if(was<100&&mercy>=100)sfx('sparkle');
else sfx(a.add>0?'act':'nope');
say(a.text,enemyTurn);

function findNear(){

}
function useObj(o){
if(o.type==='sign')wsay(o.text,null,'sign');
else if(o.type==='npc'){
if(killCount()>0)wsay(FEAR[o.kind],null,o.kind);
else wsay(o.talked?o.again:o.text,null,o.kind);
o.talked=true;
}else if(o.type==='shop'){
const k=killCount();
if(k>=3)wsay(FEAR.merchant,null,o.kind);
else if(k===1)wsay(['* 별빛 상인: "...소문은 들었어.\n  값은 두 배야."'],openShop,o.kind);
else wsay(o.talked?o.again:o.text,openShop,o.kind);
o.talked=true;
}else if(o.type==='item'){
if(got[o.id])wsay(['* 상자는 텅 비어 있다.']);
else{
got[o.id]=true;
items[0].n+=o.give;
sfx('item');
wsay(['* 구름 과자 상자를 열었다!\n* 시나몬 롤을 얻었다. (보유 '+items[0].n+'개)']);
}
}else if(o.type==='save'){
hp=maxHp;
saveGame();
sfx('save');
wsay(['* 별빛이 몸을 감싼다.\n* HP가 모두 회복되었다.\n* (저장되었습니다)']);
}else if(o.type==='zap'){
if(got[o.id])wsay(['* 꽃은 아직 파직거린다. 건드리지 말자.']);
else{
got[o.id]=true;
hp=Math.max(1,hp-2);
sfx('zap');
wsay(['* 반짝이는 꽃을 만졌다.\n* 찌릿! HP가 2 줄었다.']);
}
}
}
function interact(){
if(enemyAlive()){
const e=ENEMY_POS[stage];
if(Math.hypot(e[0]-player.x,e[1]-(player.y-10))<90){startEncounter();return;}
}
const o=findNear();
if(o)useObj(o);
}

function overlap(x,y,rx,ry,rw,rh){
return x-PW<rx+rw&&x+PW>rx&&y-PH<ry+rh&&y+PH>ry;
}
function blocked(x,y){
if(!roadAt(x-PW,y-PH)||!roadAt(x+PW,y-PH)||!roadAt(x-PW,y+PH)||!roadAt(x+PW,y+PH))return true;
if(enemyAlive()&&y-PH<ENEMY_POS[stage][1]-14)return true;
for(let i=0;i<OBJS.length;i++){
const o=OBJS[i];
if(o.type==='save')continue;
if(overlap(x,y,o.x-12,o.y-8,24,14))return true;
}
return false;
}
function updateWorld(dt){
if(wcool>0)wcool-=dt;
let mx=0,my=0;
if(keys['arrowleft']||keys['a'])mx-=1;
if(keys['arrowright']||keys['d'])mx+=1;
if(keys['arrowup']||keys['w'])my-=1;
if(keys['arrowdown']||keys['s'])my+=1;
if(stick.a){
const dx=stick.x-JOY.x,dy=stick.y-JOY.y;
const len=Math.hypot(dx,dy);
if(len>12){mx=dx/len;my=dy/len;}
}
const m=Math.hypot(mx,my);
if(m>0){
if(m>1){mx/=m;my/=m;}
const sp=(keys['shift']?60:115)*dt;
const nx=player.x+mx*sp;
if(!blocked(nx,player.y))player.x=nx;
const ny=player.y+my*sp;
if(!blocked(player.x,ny))player.y=ny;
player.moving=true;
player.anim+=dt*12;
if(Math.abs(mx)>Math.abs(my))player.dir=mx<0?2:3;
else player.dir=my<0?1:0;
}else player.moving=false;
const z=zoneOf(player.y);
if(z!==curZone){
curZone=z;
bannerT=3;
}
near=findNear();
if(enemyAlive()&&wcool<=0&&player.y<ENEMY_POS[stage][1]+50)startEncounter();
}

function settingsChoose(){
if(setSel===0)toggleMute();
else if(setSel===1){
vol=(vol+1)%3;
applyVol();
saveCfg();
sfx('select');
}else if(setSel===2){
if(state!=='title'){
settingsOpen=false;
stick.a=false;
toTitle();
}
}else settingsOpen=false;
}
function settingsPress(a){
if(a==='u')setSel=(setSel+3)%4;
else if(a==='d')setSel=(setSel+1)%4;
else if(a==='no')settingsOpen=false;
else if(a==='l'||a==='r'){
if(setSel===1){
vol=(vol+(a==='r'?1:2))%3;
applyVol();
saveCfg();
sfx('move');
}
}else if(a==='ok')settingsChoose();
}
function settingsPointer(p){
for(let i=0;i<4;i++){
if(hit(p,SETP.x+20,SETP.y+54+i*44,SETP.w-40,38)){
setSel=i;
settingsChoose();
return;
}
}
if(!hit(p,SETP.x,SETP.y,SETP.w,SETP.h))settingsOpen=false;
}

function press(a){
if(settingsOpen){settingsPress(a);return;}
const ui=state==='title'||state==='slots'||state==='menu'||state==='sub'||state==='name'||state==='shop';
if(ui){
if(a==='u'||a==='d'||a==='l'||a==='r')sfx('move');
else if(a==='ok')sfx('select');
else if(a==='no')sfx('cancel');
}else if((state==='end'||state==='dead')&&(a==='ok'||a==='no'))sfx('select');
if(state==='title'){
if(a==='u'||a==='d')tSel=(tSel+1)%2;
else if(a==='ok'){
if(tSel===0){refreshSlots();slotSel=0;ovOpen=false;state='slots';}
else storyText(howto,()=>{state='title';});
}
}else if(state==='slots'){
if(ovOpen){
if(a==='u')ovSel=(ovSel+ovOpts.length-1)%ovOpts.length;
else if(a==='d')ovSel=(ovSel+1)%ovOpts.length;
else if(a==='no')ovOpen=false;
else if(a==='ok')ovChoose();
}else{
if(a==='u')slotSel=(slotSel+3)%4;
else if(a==='d')slotSel=(slotSel+1)%4;
else if(a==='no')state='title';
else if(a==='ok'){
if(slotSel===3)state='title';
else if(slotInfo[slotSel]){
ovOpen=true;
ovMode='main';
ovOpts=[slotInfo[slotSel].cleared?'엔딩 보기':'이어하기','삭제','취소'];
ovSel=0;
}else newGame(slotSel);
}
}
}else if(state==='name'){
if(a==='u')nameSel=(nameSel+2)%3;
else if(a==='d')nameSel=(nameSel+1)%3;
else if(a==='no')state='slots';
else if(a==='ok'){
if(nameSel===0)askName();
else if(nameSel===1)startNewGame();
else state='slots';
}
}else if(state==='story'){
if(a==='ok'){
const len=story.lines[story.i].length;
if(story.ch<len)story.ch=len;
else{
story.i++;
story.ch=0;
if(story.i>=story.lines.length)story.cb();
}
}
}else if(state==='world'){
if(a==='ok')interact();
else if(a==='no'){settingsOpen=true;setSel=0;}
}else if(state==='wtalk'){
if(a==='ok'&&talk){
if(talk.i<talk.text.length)talk.i=talk.text.length;
else{
wq.i++;
if(wq.i>=wq.arr.length){
const cb=wq.cb;
state='world';
if(cb)cb();
}else talk={text:wq.arr[wq.i],i:0,cb:null};
}
}
}else if(state==='shop'){
const n=SHOP.length+1;
if(a==='u')shopSel=(shopSel+n-1)%n;
else if(a==='d')shopSel=(shopSel+1)%n;
else if(a==='no')closeShop();
else if(a==='ok'){
if(shopSel===SHOP.length)closeShop();
else buy(shopSel);
}
}else if(state==='menu'){
if(a==='l')sel=(sel+3)%4;
else if(a==='r')sel=(sel+1)%4;
else if(a==='ok'){
if(sel===0)startAttack();
else if(sel===1){state='sub';subSel=0;sub='act';}
else if(sel===2){if(items[0].n+items[1].n>0){state='sub';subSel=items[0].n>0?0:1;sub='item';}}
else{state='sub';subSel=0;sub='mercy';}
}
}else if(state==='sub'){
const len=subLen();
if(sub==='act'){
const row=subSel>>1,col=subSel&1;
if(a==='l'){if(col===1)subSel--;}
else if(a==='r'){if(col===0&&subSel+1<len)subSel++;}
else if(a==='u'){if(row>0)subSel-=2;}
else if(a==='d'){if(subSel+2<len)subSel+=2;}
}else{
if(a==='u')subSel=(subSel+len-1)%len;
else if(a==='d')subSel=(subSel+1)%len;
}
if(a==='no')state='menu';
else if(a==='ok'){
if(sub==='act')doAct(subSel);
else if(sub==='item')doItem();
else if(subSel===0)doSpare();
else doFlee();
}
}else if(state==='talk'){
if(a==='ok'&&talk){
if(talk.i<talk.text.length)talk.i=talk.text.length;
else talk.cb();
}
}else if(state==='attack'){
if(a==='ok')resolveAttack();
}else if(state==='dead'){
if(a==='ok')loadGame(slotIdx);
else if(a==='no')toTitle();
}else if(state==='end'){
if(a==='ok')toTitle();
}
}

addEventListener('keydown',e=>{

if(k==='f'){toggleFull();return;}
if(k==='arrowleft'||k==='a')press('l');
else if(k==='arrowright'||k==='d')press('r');
else if(k==='arrowup'||k==='w')press('u');
else if(k==='arrowdown'||k==='s')press('d');
else if(k==='z'||k==='enter'||k===' ')press('ok');

return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function hit(p,x,y,w,h){
return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;
}

function subLen(){
return sub==='act'?cur.acts.length:2;
}
function subX(i){
return sub==='act'?box.x+30+(i&1)*250:box.x+30;
}
function subY(i){

return;

return;

return;

function updateDodge(dt){
let mx=0,my=0;
if(keys['arrowleft']||keys['a'])mx-=1;
if(keys['arrowright']||keys['d'])mx+=1;
if(keys['arrowup']||keys['w'])my-=1;
if(keys['arrowdown']||keys['s'])my+=1;
if(stick.a){
const sx=stick.x-JOY.x,sy=stick.y-JOY.y;
const sl=Math.hypot(sx,sy);
if(sl>12){mx=sx/sl;my=sy/sl;}
}
const sp=(keys['shift']||keys['x'])?80:160;
soul.x+=mx*sp*dt;
if(blueNow){
const fl=box.y+box.h-soul.r-3;
if(my<-0.3&&soul.y>=fl-0.5){
soulVy=-250;
sfx('move');
}else if(my>=-0.3&&soulVy<-90)soulVy=-90;
soulVy+=900*dt;
soul.y+=soulVy*dt;
if(soul.y>=fl){
soul.y=fl;
soulVy=0;
}else if(soul.y<=box.y+soul.r+3)soulVy=Math.max(soulVy,0);
}else soul.y+=my*sp*dt;
const m=soul.r+3;
if(soul.x<box.x+m)soul.x=box.x+m;
if(soul.x>box.x+box.w-m)soul.x=box.x+box.w-m;
if(soul.y<box.y+m)soul.y=box.y+m;
if(soul.y>box.y+box.h-m)soul.y=box.y+box.h-m;
dodgeT+=dt;
spawnT-=dt;
const sm=Math.min(1.8,cur.sm+turn*0.08+(phase2?0.15:0));
const id=curPat();
if(dodgeT>=0&&dodgeT<cur.dur-1&&spawnT<=0){
if(id===0){
spawnT=0.16;
spawn(box.x+8+Math.random()*(box.w-16),box.y-12,0,150*sm,5);
}else if(id===1){
spawnT=1.0;
spawnWall(sm);
}else if(id===2){
spawnT=0.8;
ringA+=0.4;
for(let i=0;i<10;i++){
const ang=ringA+i*Math.PI/5;
spawn(320,110,Math.cos(ang)*110*sm,Math.sin(ang)*110*sm,5);
}
}else if(id===3){
spawnT=0.55;
const base=Math.atan2(soul.y-110,soul.x-320);
for(let i=-1;i<=1;i++){
const ang=base+i*0.28;
spawn(320,110,Math.cos(ang)*150*sm,Math.sin(ang)*150*sm,5);
}
}else if(id===4){
spawnT=0.11;
const ang=Math.PI/2+Math.sin(dodgeT*2.5)*0.9;
spawn(320,110,Math.cos(ang)*130*sm,Math.sin(ang)*130*sm,4);
}else if(id===7){
spawnT=0.2;
spawn(box.x+8+Math.random()*(box.w-16),box.y-12,(Math.random()-0.5)*130*sm,140*sm,5);
}else if(id===8){
spawnT=0.07;
ringA+=0.55;
spawn(320,110,Math.cos(ringA)*100*sm,Math.sin(ringA)*100*sm,4);
}else if(id===9){
spawnT=0.75;
spawn(box.x-10,soul.y,170*sm,0,5);
spawn(box.x+box.w+10,soul.y,-170*sm,0,5);
}else if(id===6){
spawnT=0.8;
ringA++;
if(ringA%3===0){
for(let i=0;i<3;i++)spawn(box.x+10+Math.random()*(box.w-20),box.y-12,0,170*sm,5);
}else{
const dir=Math.random()<0.5?1:-1;
const sx=dir>0?box.x-10:box.x+box.w+10;
spawn(sx,box.y+box.h-10,150*sm*dir,0,6);
}
}else{
ringA+=1;
if(ringA%2===0){
spawnT=0.7;
spawnWall(sm);
}else{
spawnT=0.5;
for(let i=0;i<5;i++)spawn(box.x+10+Math.random()*(box.w-20),box.y-12,0,150*sm,5);
}
}
}
for(let i=0;i<POOL;i++){
const b=bullets[i];
if(!b.a)continue;
b.x+=b.vx*dt;
b.y+=b.vy*dt;
if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){b.a=false;continue;}
if(hurtT<=0){
const ddx=b.x-soul.x,ddy=b.y-soul.y,rr=b.r+soul.r-2;
if(ddx*ddx+ddy*ddy<rr*rr){
hp-=cur.dmg;
hurtT=1;
sfx('hurt');
}
}
}
if(hp<=0){
hp=0;
clearBullets();
stick.a=false;
state='dead';
boxT=WIDE;
sfx('lose');
return;
}
if(dodgeT>=cur.dur){
clearBullets();
stick.a=false;
turn++;
toMenu();
}
}

function update(dt){
t+=dt;
if(saveT>0)saveT-=dt;
pickBgm();
setBgm(wantName,wantShift);
if(settingsOpen)return;
if(bannerT>0)bannerT-=dt;
if(btnFlash>0)btnFlash-=dt;
if(state!=='title'&&state!=='slots'&&state!=='end'&&state!=='dead')playTime+=dt;
const k=Math.min(1,dt*12);
box.x+=(boxT.x-box.x)*k;
box.y+=(boxT.y-box.y)*k;
box.w+=(boxT.w-box.w)*k;
box.h+=(boxT.h-box.h)*k;
if(hurtT>0)hurtT-=dt;
if(shake>0)shake-=dt;
if(hpShow>0)hpShow-=dt;
if(dmgT>0)dmgT-=dt;
if(state==='story'){
if(story.i<story.lines.length&&story.ch<story.lines[story.i].length)story.ch+=dt*30;
}else if((state==='talk'||state==='wtalk')&&talk&&talk.i<talk.text.length){
talk.i+=dt*45;
const ci=Math.floor(talk.i);
if(ci!==blipCi){
blipCi=ci;
if(ci%3===0)sfx('blip');
}
}else if(state==='world')updateWorld(dt);
else if(state==='enc'){
encT-=dt;
if(encT<=0)beginBattle();
}else if(state==='attack'){
atk.x+=520*dt;
if(atk.x>580){
dmgN=0;
dmgT=0.9;
say('* 공격이 빗나갔다...',enemyTurn);
}
}else if(state==='dodge')updateDodge(dt);
}

ctx.drawImage(S.merchant,Math.round(x-S.merchant.width/2),Math.round(y+6-S.merchant.height+bob));
}else if(o.type==='item'){
shadow(x,y+6,14);
const c=got[o.id]?S.chestOpen:S.chest;
ctx.drawImage(c,Math.round(x-c.width/2),Math.round(y+6-c.height));
}else if(o.type==='save'){
ctx.globalAlpha=0.3+0.2*Math.sin(t*3);
ctx.drawImage(S.glow,Math.round(x-S.glow.width/2),Math.round(y-10-S.glow.height/2));

ctx.drawImage(c,Math.round(x-c.width/2),Math.round(y-10-c.height/2));
}else if(o.type==='zap'){
shadow(x,y+6,10);
ctx.fillStyle='#2e6f3a';
ctx.fillRect(x-2,y-14,4,20);
ctx.fillRect(x-8,y-4,6,4);
ctx.fillRect(x+2,y-8,6,4);

ctx.drawImage(c,Math.round(x-c.width/2),Math.round(y-20-c.height/2));
}
}
function drawPlayer(){

function drawOverlayInfo(){
drawSetBtn();
if(isTouch&&innerHeight>innerWidth*1.15&&(state==='world'||state==='title')){
ctx.globalAlpha=0.85;

setF(14);
ctx.textAlign='center';
ctx.fillText('기기를 가로로 돌리면 더 크게 즐길 수 있어요',320,68);

ctx.globalAlpha=1;
}

ctx.globalAlpha=Math.min(1,saveT);

function draw(){
const rs=cv.width/W;
ctx.setTransform(rs,0,0,rs,0,0);
ctx.fillStyle='#000';
ctx.fillRect(0,0,W,H);
const sk=state==='dodge'&&phase2;
if(sk){
ctx.save();
ctx.translate(Math.round((Math.random()-0.5)*5),Math.round((Math.random()-0.5)*5));
}
if(state==='title')drawTitle();
else if(state==='slots')drawSlots();
else if(state==='name')drawName();
else if(state==='story')drawStory();
else if(state==='end')drawEnd();
else if(state==='dead')drawDead();
else if(state==='world'||state==='wtalk'||state==='enc'||state==='shop')drawWorld();
else{
drawEnemy(cur.kind,320,120,5,mercy,shake>0);
drawEnemyBar();
drawDmgPop();
drawBubble();
drawBox();
drawContent();
if(state==='dodge'){
drawBullets();
if(hurtT<=0||Math.floor(t*20)%2===0)heart(soul.x,soul.y,blueNow);
drawJoystick();
}
drawHud();
}
if(sk)ctx.restore();
drawOverlayInfo();
}

const bgStars=[];
for(let i=0;i<180;i++)bgStars.push({x:Math.random(),y:Math.random(),z:Math.random()<0.2?4:2,ph:Math.random()*4});
const bgClouds=[[0.08,0.2,5,0.6],[0.92,0.35,6,0.5],[0.15,0.62,7,0.7],[0.85,0.78,5,0.6],[0.04,0.9,6,0.5],[0.96,0.08,4,0.6]];
function drawBg(){
if(!bgNeed)return;
const w=bgc.width,h=bgc.height;
let top='#0d1430',bot='#1a2250';
if(state==='world'||state==='wtalk'||state==='shop'||state==='enc'){
const cy=Math.max(0,Math.min(WORLD_H-H,player.y-300));
top=skyAt(cy);
bot=skyAt(cy+H);
}
const gr=bgx.createLinearGradient(0,0,0,h);
gr.addColorStop(0,top);
gr.addColorStop(1,bot);
bgx.fillStyle=gr;
bgx.fillRect(0,0,w,h);
bgx.fillStyle='#fff';
for(let i=0;i<bgStars.length;i++){
const st=bgStars[i];
bgx.globalAlpha=(Math.floor(t*2+st.ph)%2)?1:0.4;
bgx.fillRect(Math.floor(st.x*w/2)*2,Math.floor(st.y*h/2)*2,st.z*bgScale,st.z*bgScale);
}
bgx.globalAlpha=1;
const sc=S.skyCloud;
for(let i=0;i<bgClouds.length;i++){
const c=bgClouds[i];
const dw=sc.width*c[2]*bgScale;
const dh=sc.height*c[2]*bgScale;
bgx.globalAlpha=c[3];
bgx.drawImage(sc,c[0]*w-dw/2+Math.sin(t*0.15+i)*14*bgScale,c[1]*h-dh/2,dw,dh);
}
bgx.globalAlpha=1;
}
function loop(now){
const dt=Math.min(0.05,(now-lastTime)/1000||0);
lastTime=now;
update(dt);
drawBg();
draw();
requestAnimationFrame(loop);
}

loadCfg();
loadMeta();
buildSprites();
buildRoad();
buildWorldBg();
refreshSlots();
requestAnimationFrame(loop);
</script>
